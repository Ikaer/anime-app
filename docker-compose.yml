version: '3.8'

services:
  anime-tracker:
    image: anime-tracker:${BUILD_VERSION:-latest}
    build: 
      context: .
      args:
        - BUILD_DATE=2025-07-14-v4
    ports:
      - "12350:3000"
    volumes:
      - /volume4/root4/AppData/AnimeTracker/data:/app/data
      - /volume4/root4/AppData/AnimeTracker/logs:/app/logs
    environment:
      - NODE_ENV=production
      - DATA_PATH=/app/data
      - LOGS_PATH=/app/logs
      # Substituted from the stack's CRON_SECRET variable, so the app and the
      # cron container below can never drift apart. NOTE: a `cronSecret` stored
      # in settings.json takes PRECEDENCE over this (resolveSetting reads stored
      # before env), so the two must hold the same value — or clear the stored
      # one and let this be the single source.
      - CRON_SECRET=${CRON_SECRET}
    restart: unless-stopped
    container_name: anime-tracker
    user: "0:0"

  cron:
    image: alpine:latest
    depends_on:
      - anime-tracker
    environment:
      # Same substitution as the app above, so the two still cannot drift. The
      # difference is what happens next: the value reaches the JOB through a
      # file, never through the crontab.
      - CRON_SECRET=${CRON_SECRET}
    # ⚠️ The secret must never be interpolated into a `printf` FORMAT string,
    # and must never land in /etc/crontabs/root. Baking it in is what silently
    # killed the 02:00 tick (2026-08-24): a metacharacter in the value truncated
    # printf's output mid-quote, so the crontab held
    # `... -H "Authorization: Bearer X2` and crond dutifully ran `sh -c` on an
    # unterminated string every night — nothing ever reached the app, so not
    # even the 401 path logged. Passing the value as a `%s` ARGUMENT makes `%`,
    # `\`, `$` and quotes literal by construction, which retires the "keep the
    # secret alphanumeric" rule this used to depend on. `$$` is compose's escape
    # for a literal `$`.
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache curl
        printf '%s' "$$CRON_SECRET" > /run/cron_secret
        chmod 600 /run/cron_secret
        cat > /usr/local/bin/anime-cron-sync <<'SCRIPT'
        #!/bin/sh
        exec curl -sS -X POST \
          -H "Authorization: Bearer $$(cat /run/cron_secret)" \
          -H "Content-Type: application/json" \
          -d '{"origin":"docker cron job"}' \
          http://anime-tracker:3000/api/anime/cron-sync
        SCRIPT
        chmod +x /usr/local/bin/anime-cron-sync
        echo '0 2 * * * /usr/local/bin/anime-cron-sync' > /etc/crontabs/root
        exec crond -f -d 8
    restart: unless-stopped
    container_name: anime-tracker-cron
